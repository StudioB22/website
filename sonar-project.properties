# Local SonarQube analysis (ADR-0005); the server URL is set by `just sonar`. The token is never
# stored here: `just sonar` uses the global analysis token exported as SONAR_TOKEN
# (~/.config/sonarqube/analysis-token, skill infra-accounts).
sonar.projectKey=studiob22-website
sonar.projectName=studiob22-website
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Astro route handlers are exercised by the generated-site test, not by Vitest (vitest.config.ts).
sonar.coverage.exclusions=src/pages/**,src/env.d.ts
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=120
