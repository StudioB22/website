# Local CI toolchain (#17, skill local-ci): every CLI the justfile tiers and the lefthook hooks
# call, pinned; `mise.lock` pins the checksums. `just setup` installs it. System tool outside mise:
# sonar-scanner (not in the mise registry, skill infra-accounts).
#
# Node follows the .nvmrc major (mise.lock pins the exact build, the nightly drift check flags a
# newer patch); npm ships with it. Not here, on purpose (rule 1 of the skill): typos (the site is
# French-first), osv-scanner and Trivy (`npm audit` already audits the lockfile; no Dockerfile),
# actionlint and zizmor (no workflow is left, ADR-0005).
[tools]
node = "22"
just = "1.59.0"
lefthook = "2.2.2"
gitleaks = "8.30.1" # the pin of the removed gitleaks.yml
trufflehog = "3.99.8"
jq = "1.8.2" # scripts/test-attest.sh applies the `gh api -q` filter through it
# Semgrep Community Edition (SAST, replaces CodeQL). pipx backend: the version is pinned, its Python
# dependencies are resolved at install time (accepted gap, ADR-0005 consequences).
"pipx:semgrep" = "1.184.0"

[settings]
lockfile = true
